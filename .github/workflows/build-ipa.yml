name: Build Unsigned iOS IPA (No Mac Required)

on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ipa:
    name: Compile & Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare SwiftUI Source & XcodeGen Config
        run: |
          rm -rf NotchIsland project.yml Info.plist NotchIsland.xcodeproj build Payload
          mkdir -p NotchIsland

          cat << 'EOF_PROJECT' > project.yml
          name: NotchIsland
          options:
            bundleIdPrefix: com.notchisland
            deploymentTarget:
              iOS: "16.0"

          settings:
            base:
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              SUPPORTS_MACCATALYST: NO
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              DEVELOPMENT_TEAM: ""
              ENABLE_BITCODE: NO

          targets:
            NotchIsland:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: NotchIsland
                  excludes:
                    - "**/*.plist"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: NotchIsland
                  CFBundleShortVersionString: "2.0.0"
                  CFBundleVersion: "2"
                  UILaunchScreen: {}
                  UIStatusBarHidden: true
                  UIViewControllerBasedStatusBarAppearance: false
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  UIBackgroundModes:
                    - audio
                  NSAppleMusicUsageDescription: "NotchIsland detects currently playing music and audio across your device to display live playback status in the notch and floating background island."
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.notchisland.iphone11
                  MARKETING_VERSION: "2.0.0"
                  CURRENT_PROJECT_VERSION: "2"
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: Info.plist
          EOF_PROJECT

          cat << 'EOF_PLIST' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>$(DEVELOPMENT_LANGUAGE)</string>
              <key>CFBundleDisplayName</key>
              <string>NotchIsland</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0.0</string>
              <key>CFBundleVersion</key>
              <string>2</string>
              <key>LSRequiresIPhoneOS</key>
              <string>YES</string>
              <key>NSAppleMusicUsageDescription</key>
              <string>NotchIsland detects currently playing music and audio across your device to display live playback status in the notch and floating background island.</string>
              <key>UIBackgroundModes</key>
              <array>
                  <key>audio</key>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIStatusBarHidden</key>
              <true/>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF_PLIST

          cat << 'EOF_APP' > NotchIsland/NotchIslandApp.swift
          import SwiftUI

          @main
          struct NotchIslandApp: App {
              @StateObject private var viewModel = NotchViewModel()
              @StateObject private var pipManager = PiPIslandManager()
              @Environment(\.scenePhase) private var scenePhase

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environmentObject(viewModel)
                          .environmentObject(pipManager)
                          .preferredColorScheme(.dark)
                          .statusBar(hidden: true)
                          .onAppear {
                              UIApplication.shared.isIdleTimerDisabled = true
                              pipManager.bind(to: viewModel)
                          }
                          .onChange(of: scenePhase) { newPhase in
                              viewModel.refreshNowPlayingAndSystemAudio()
                              pipManager.pushCurrentFrame()
                              if newPhase == .inactive || newPhase == .background {
                                  pipManager.ensureBackgroundKeepAliveAndPiP()
                              }
                          }
                  }
              }
          }
          EOF_APP

          cat << 'EOF_VM' > NotchIsland/NotchViewModel.swift
          import SwiftUI
          import MediaPlayer
          import AVFoundation
          import Combine
          import UIKit
          import Darwin

          enum IslandTab: String, CaseIterable, Identifiable {
              case media = "Music"
              case timer = "Timer"
              case system = "System"
              case shelf = "Shelf"

              var id: String { rawValue }

              var icon: String {
                  switch self {
                  case .media: return "waveform"
                  case .timer: return "timer"
                  case .system: return "bolt.shield.fill"
                  case .shelf: return "tray.full.fill"
                  }
              }
          }

          final class NotchViewModel: ObservableObject {
              // MARK: - Island Geometry & State
              @Published var isExpanded: Bool = false
              @Published var selectedTab: IslandTab = .media
              @Published var notchWidth: CGFloat = 214
              @Published var notchHeight: CGFloat = 34

              // MARK: - Live Audio & Now Playing Detection State
              @Published var trackTitle: String = "No Audio Playing"
              @Published var trackArtist: String = "Play Spotify, YouTube, or Music"
              @Published var audioSourceBadge: String = "IDLE"
              @Published var isPlaying: Bool = false
              @Published var isOtherAppAudioPlaying: Bool = false
              @Published var trackProgress: Double = 0.0
              @Published var waveformPhase: Int = 0

              // MARK: - Timer State
              @Published var timerRemainingSeconds: Int = 300
              @Published var timerTotalSeconds: Int = 300
              @Published var isTimerRunning: Bool = false

              // MARK: - System HUD State
              @Published var batteryLevel: Int = 85
              @Published var isCharging: Bool = false
              @Published var freeDiskGB: String = "42.8 GB"

              // MARK: - Quick Shelf / Clipboard
              @Published var clipboardText: String = "Tap 'Paste' to pin copied text inside your notch."
              @Published var quickNotes: [String] = [
                  "Works in background via PiP Island",
                  "Auto-detects Spotify, YouTube & Music",
                  "Swipe home to float the island over any app"
              ]

              private var timerCancellable: AnyCancellable?
              private let musicPlayer = MPMusicPlayerController.systemMusicPlayer

              // Dynamic MediaRemote function pointers (when available on sideloaded iOS)
              private typealias MRGetNowPlayingInfoFunc = @convention(c) (DispatchQueue, @escaping ([String: Any]?) -> Void) -> Void
              private var mrGetNowPlayingInfo: MRGetNowPlayingInfoFunc?

              init() {
                  UIDevice.current.isBatteryMonitoringEnabled = true
                  loadMediaRemoteIfAvailable()
                  refreshSystemStats()
                  setupMediaAndAudioNotifications()
                  startBackgroundHeartbeat()
              }

              private func loadMediaRemoteIfAvailable() {
                  let path = "/System/Library/PrivateFrameworks/MediaRemote.framework/MediaRemote"
                  guard let handle = dlopen(path, RTLD_LAZY) else { return }
                  if let sym = dlsym(handle, "MRMediaRemoteGetNowPlayingInfo") {
                      mrGetNowPlayingInfo = unsafeBitCast(sym, to: MRGetNowPlayingInfoFunc.self)
                  }
              }

              func toggleExpand() {
                  UIImpactFeedbackGenerator(style: isExpanded ? .light : .medium).impactOccurred()
                  withAnimation(.spring(response: 0.42, dampingFraction: 0.74, blendDuration: 0.1)) {
                      isExpanded.toggle()
                  }
                  refreshNowPlayingAndSystemAudio()
                  refreshSystemStats()
              }

              func selectTab(_ tab: IslandTab) {
                  UISelectionFeedbackGenerator().selectionChanged()
                  withAnimation(.spring(response: 0.35, dampingFraction: 0.78)) {
                      selectedTab = tab
                      if !isExpanded {
                          isExpanded = true
                      }
                  }
              }

              // MARK: - System-Wide Audio & Now Playing Detection
              func setupMediaAndAudioNotifications() {
                  musicPlayer.beginGeneratingPlaybackNotifications()

                  let nc = NotificationCenter.default
                  nc.addObserver(forName: .MPMusicPlayerControllerNowPlayingItemDidChange, object: musicPlayer, queue: .main) { [weak self] _ in
                      self?.refreshNowPlayingAndSystemAudio()
                  }
                  nc.addObserver(forName: .MPMusicPlayerControllerPlaybackStateDidChange, object: musicPlayer, queue: .main) { [weak self] _ in
                      self?.refreshNowPlayingAndSystemAudio()
                  }
                  nc.addObserver(forName: AVAudioSession.silenceSecondaryAudioHintNotification, object: nil, queue: .main) { [weak self] _ in
                      self?.refreshNowPlayingAndSystemAudio()
                  }
                  nc.addObserver(forName: AVAudioSession.routeChangeNotification, object: nil, queue: .main) { [weak self] _ in
                      self?.refreshNowPlayingAndSystemAudio()
                  }

                  refreshNowPlayingAndSystemAudio()
              }

              func refreshNowPlayingAndSystemAudio() {
                  let session = AVAudioSession.sharedInstance()
                  let otherAudio = session.isOtherAudioPlaying
                  isOtherAppAudioPlaying = otherAudio

                  let musicState = musicPlayer.playbackState
                  let appleMusicPlaying = (musicState == .playing)

                  // 1. Check Apple Music / system music player first for rich metadata
                  if let item = musicPlayer.nowPlayingItem {
                      let title = item.title ?? "Playing Audio"
                      let artist = item.artist ?? "Apple Music"
                      trackTitle = title
                      trackArtist = artist
                      let duration = item.playbackDuration
                      if duration > 0 {
                          trackProgress = min(max(musicPlayer.currentPlaybackTime / duration, 0), 1)
                      }
                      if appleMusicPlaying {
                          isPlaying = true
                          audioSourceBadge = "MUSIC"
                          return
                      }
                  }

                  // 2. Query MediaRemote if available on this iOS build
                  if let mrFunc = mrGetNowPlayingInfo {
                      mrFunc(DispatchQueue.main) { [weak self] info in
                          guard let self = self, let info = info else { return }
                          if let title = info["kMRMediaRemoteNowPlayingInfoTitle"] as? String, !title.isEmpty {
                              self.trackTitle = title
                              self.trackArtist = (info["kMRMediaRemoteNowPlayingInfoArtist"] as? String) ?? "Now Playing"
                          }
                      }
                  }

                  // 3. Detect ANY background app playing audio (Spotify, YouTube, SoundCloud, TikTok, Safari, etc.)
                  if otherAudio || appleMusicPlaying {
                      isPlaying = true
                      audioSourceBadge = "LIVE AUDIO"
                      if trackTitle == "No Audio Playing" {
                          trackTitle = "Audio Playing in Background"
                          trackArtist = "Spotify / YouTube / System Audio"
                      }
                      trackProgress = fmod(trackProgress + 0.03, 1.0)
                  } else {
                      isPlaying = false
                      audioSourceBadge = "STANDBY"
                      if musicPlayer.nowPlayingItem == nil {
                          trackTitle = "No Audio Playing"
                          trackArtist = "Play Spotify, YouTube, or Music"
                          trackProgress = 0.0
                      }
                  }
              }

              func togglePlayPause() {
                  UIImpactFeedbackGenerator(style: .rigid).impactOccurred()
                  if musicPlayer.playbackState == .playing {
                      musicPlayer.pause()
                      isPlaying = false
                  } else if musicPlayer.nowPlayingItem != nil {
                      musicPlayer.play()
                      isPlaying = true
                  } else {
                      // Toggle state & refresh detection
                      refreshNowPlayingAndSystemAudio()
                  }
              }

              func nextTrack() {
                  UIImpactFeedbackGenerator(style: .light).impactOccurred()
                  musicPlayer.skipToNextItem()
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.25) { [weak self] in
                      self?.refreshNowPlayingAndSystemAudio()
                  }
              }

              func previousTrack() {
                  UIImpactFeedbackGenerator(style: .light).impactOccurred()
                  musicPlayer.skipToPreviousItem()
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.25) { [weak self] in
                      self?.refreshNowPlayingAndSystemAudio()
                  }
              }

              // MARK: - Timer Controls
              func toggleTimer() {
                  UIImpactFeedbackGenerator(style: .medium).impactOccurred()
                  isTimerRunning.toggle()
              }

              func resetTimer(seconds: Int = 300) {
                  UIImpactFeedbackGenerator(style: .soft).impactOccurred()
                  isTimerRunning = false
                  timerTotalSeconds = seconds
                  timerRemainingSeconds = seconds
              }

              var formattedTimer: String {
                  let mins = timerRemainingSeconds / 60
                  let secs = timerRemainingSeconds % 60
                  return String(format: "%02d:%02d", mins, secs)
              }

              // MARK: - System & Clipboard
              func refreshSystemStats() {
                  let rawBattery = UIDevice.current.batteryLevel
                  if rawBattery >= 0 {
                      batteryLevel = Int(rawBattery * 100)
                  }
                  let state = UIDevice.current.batteryState
                  isCharging = (state == .charging || state == .full)

                  if let attrs = try? FileManager.default.attributesOfFileSystem(forPath: NSHomeDirectory()),
                     let freeSize = attrs[.systemFreeSize] as? Int64 {
                      let gb = Double(freeSize) / 1_073_741_824.0
                      freeDiskGB = String(format: "%.1f GB", gb)
                  }
              }

              func pasteFromClipboard() {
                  UIImpactFeedbackGenerator(style: .light).impactOccurred()
                  if let str = UIPasteboard.general.string, !str.isEmpty {
                      clipboardText = str
                      if !quickNotes.contains(str) {
                          quickNotes.insert(str, at: 0)
                      }
                  } else {
                      clipboardText = "Clipboard is currently empty."
                  }
              }

              private func startBackgroundHeartbeat() {
                  timerCancellable = Timer.publish(every: 1.0, on: .main, in: .common)
                      .autoconnect()
                      .sink { [weak self] _ in
                          guard let self = self else { return }
                          self.waveformPhase = (self.waveformPhase + 1) % 4
                          self.refreshNowPlayingAndSystemAudio()
                          if self.isTimerRunning {
                              if self.timerRemainingSeconds > 0 {
                                  self.timerRemainingSeconds -= 1
                              } else {
                                  self.isTimerRunning = false
                              }
                          }
                      }
              }
          }
          EOF_VM

          cat << 'EOF_PIP' > NotchIsland/PiPIslandManager.swift
          import SwiftUI
          import UIKit
          import AVKit
          import AVFoundation
          import CoreMedia
          import CoreVideo
          import Combine

          /// UIView subclass whose backing CALayer is AVSampleBufferDisplayLayer.
          /// Required by iOS AVKit so Picture-in-Picture recognizes the inline view and auto-starts when swiping Home.
          final class SampleBufferDisplayView: UIView {
              override class var layerClass: AnyClass {
                  AVSampleBufferDisplayLayer.self
              }

              var sampleBufferLayer: AVSampleBufferDisplayLayer {
                  layer as! AVSampleBufferDisplayLayer
              }
          }

          final class PiPIslandManager: NSObject, ObservableObject, AVPictureInPictureControllerDelegate {
              @Published var isPiPActive: Bool = false
              @Published var isPiPSupported: Bool = false
              @Published var autoStartOnSwipeHome: Bool = true
              @Published var backgroundKeepAliveEnabled: Bool = true

              let hostView = SampleBufferDisplayView(frame: CGRect(x: 0, y: 0, width: 320, height: 72))
              var displayLayer: AVSampleBufferDisplayLayer { hostView.sampleBufferLayer }

              private var pipController: AVPictureInPictureController?
              private var renderTimer: AnyCancellable?
              private var audioEngine: AVAudioEngine?
              private var silentPlayerNode: AVAudioPlayerNode?
              private weak var viewModel: NotchViewModel?
              private var backgroundTaskID: UIBackgroundTaskIdentifier = .invalid

              override init() {
                  super.init()
                  configureMixedAudioSession()
                  startSilentBackgroundKeepAlive()
              }

              func bind(to viewModel: NotchViewModel) {
                  self.viewModel = viewModel
                  setupPiPController()
              }

              /// Configures AVAudioSession with .playback and .mixWithOthers so NotchIsland stays alive in the background
              /// WITHOUT ever pausing Spotify, YouTube, Apple Music, or other apps.
              func configureMixedAudioSession() {
                  do {
                      let session = AVAudioSession.sharedInstance()
                      try session.setCategory(.playback, mode: .default, options: [.mixWithOthers])
                      try session.setActive(true)
                  } catch {
                      print("AudioSession error: \(error)")
                  }
              }

              /// Plays an inaudible (0.0 amplitude) PCM buffer loop on AVAudioEngine so iOS keeps the app's
              /// audio & timer runloop active 24/7 in the background while mixing seamlessly with other audio.
              func startSilentBackgroundKeepAlive() {
                  guard backgroundKeepAliveEnabled else { return }
                  if let engine = audioEngine, engine.isRunning { return }

                  configureMixedAudioSession()
                  let engine = AVAudioEngine()
                  let player = AVAudioPlayerNode()
                  engine.attach(player)

                  let format = AVAudioFormat(standardFormatWithSampleRate: 44100, channels: 1)!
                  engine.connect(player, to: engine.mainMixerNode, format: format)
                  engine.mainMixerNode.outputVolume = 0.0001

                  if let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: 44100) {
                      buffer.frameLength = 44100
                      if let channelData = buffer.floatChannelData?[0] {
                          for i in 0..<44100 {
                              channelData[i] = 0.0
                          }
                      }
                      do {
                          try engine.start()
                          player.scheduleBuffer(buffer, at: nil, options: .loops, completionHandler: nil)
                          player.play()
                          self.audioEngine = engine
                          self.silentPlayerNode = player
                      } catch {
                          print("Silent keep-alive engine error: \(error)")
                      }
                  }
              }

              func ensureBackgroundKeepAliveAndPiP() {
                  startSilentBackgroundKeepAlive()
                  pushCurrentFrame()

                  if backgroundTaskID == .invalid {
                      backgroundTaskID = UIApplication.shared.beginBackgroundTask(withName: "NotchIslandKeepAlive") { [weak self] in
                          if let id = self?.backgroundTaskID, id != .invalid {
                              UIApplication.shared.endBackgroundTask(id)
                              self?.backgroundTaskID = .invalid
                          }
                      }
                  }

                  if autoStartOnSwipeHome, let controller = pipController, !controller.isPictureInPictureActive {
                      controller.startPictureInPicture()
                  }
              }

              func setupPiPController() {
                  displayLayer.videoGravity = .resizeAspect
                  pushCurrentFrame()

                  guard AVPictureInPictureController.isPictureInPictureSupported() else {
                      isPiPSupported = false
                      return
                  }
                  isPiPSupported = true

                  let contentSource = AVPictureInPictureController.ContentSource(
                      sampleBufferDisplayLayer: displayLayer,
                      playbackDelegate: self
                  )
                  let controller = AVPictureInPictureController(contentSource: contentSource)
                  controller.delegate = self
                  if #available(iOS 14.2, *) {
                      controller.canStartPictureInPictureAutomaticallyFromInline = true
                  }
                  self.pipController = controller

                  // Continuous frame feed (2 FPS) so the floating Home Screen island animates live in the background
                  renderTimer = Timer.publish(every: 0.5, on: .main, in: .common)
                      .autoconnect()
                      .sink { [weak self] _ in
                          self?.pushCurrentFrame()
                      }
              }

              func togglePiP() {
                  startSilentBackgroundKeepAlive()
                  guard let controller = pipController else { return }
                  pushCurrentFrame()
                  if controller.isPictureInPictureActive {
                      controller.stopPictureInPicture()
                  } else {
                      controller.startPictureInPicture()
                  }
              }

              func pushCurrentFrame() {
                  let size = CGSize(width: 680, height: 156)
                  let renderer = UIGraphicsImageRenderer(size: size)

                  let image = renderer.image { _ in
                      let rect = CGRect(origin: .zero, size: size)
                      UIColor.black.setFill()
                      UIBezierPath(roundedRect: rect, cornerRadius: 52).fill()

                      let vm = self.viewModel
                      let isAudioActive = (vm?.isPlaying == true || vm?.isOtherAppAudioPlaying == true)

                      // Dynamic border glow (Cyan when audio is playing in background, subtle dark gray when idle)
                      let borderColor = isAudioActive
                          ? UIColor.systemCyan.withAlphaComponent(0.85)
                          : UIColor(white: 0.25, alpha: 1.0)
                      borderColor.setStroke()
                      let strokePath = UIBezierPath(roundedRect: rect.insetBy(dx: 3, dy: 3), cornerRadius: 49)
                      strokePath.lineWidth = 4
                      strokePath.stroke()

                      // Left Icon / Animated Equalizer Badge
                      let badgeRect = CGRect(x: 24, y: 28, width: 100, height: 100)
                      let badgeColor = isAudioActive ? UIColor.systemCyan.withAlphaComponent(0.18) : UIColor(white: 0.12, alpha: 1.0)
                      badgeColor.setFill()
                      UIBezierPath(roundedRect: badgeRect, cornerRadius: 28).fill()

                      // Draw 4 animated equalizer bars inside the left badge when audio is detected
                      let phase = vm?.waveformPhase ?? 0
                      let barHeights: [[CGFloat]] = [
                          [26, 56, 36, 48],
                          [52, 28, 60, 32],
                          [34, 62, 24, 54],
                          [46, 34, 52, 28]
                      ]
                      let currentBars = isAudioActive ? barHeights[phase % 4] : [16, 16, 16, 16]
                      for i in 0..<4 {
                          let bh = currentBars[i]
                          let bx = CGFloat(42 + i * 17)
                          let by = 78 - bh / 2.0
                          let barRect = CGRect(x: bx, y: by, width: 10, height: bh)
                          (isAudioActive ? UIColor.systemCyan : UIColor.darkGray).setFill()
                          UIBezierPath(roundedRect: barRect, cornerRadius: 5).fill()
                      }

                      let title = vm?.trackTitle ?? "NotchIsland Active"
                      let subtitle = isAudioActive
                          ? "🔊 \(vm?.trackArtist ?? "Playing in Background")"
                          : "Standby • \(vm?.trackArtist ?? "Play any audio")"
                      let rightBadge = (vm?.isTimerRunning == true)
                          ? "⏱ \(vm?.formattedTimer ?? "05:00")"
                          : (isAudioActive ? "LIVE" : "🔋 \(vm?.batteryLevel ?? 85)%")

                      let titleAttrs: [NSAttributedString.Key: Any] = [
                          .font: UIFont.systemFont(ofSize: 28, weight: .bold),
                          .foregroundColor: UIColor.white
                      ]
                      let subAttrs: [NSAttributedString.Key: Any] = [
                          .font: UIFont.systemFont(ofSize: 20, weight: .medium),
                          .foregroundColor: isAudioActive ? UIColor.systemCyan : UIColor.lightGray
                      ]
                      let rightAttrs: [NSAttributedString.Key: Any] = [
                          .font: UIFont.monospacedDigitSystemFont(ofSize: 23, weight: .bold),
                          .foregroundColor: isAudioActive ? UIColor.systemGreen : UIColor.systemCyan
                      ]

                      NSString(string: title).draw(in: CGRect(x: 142, y: 36, width: 380, height: 38), withAttributes: titleAttrs)
                      NSString(string: subtitle).draw(in: CGRect(x: 142, y: 82, width: 380, height: 32), withAttributes: subAttrs)
                      NSString(string: rightBadge).draw(in: CGRect(x: 535, y: 58, width: 125, height: 36), withAttributes: rightAttrs)
                  }

                  if let sampleBuffer = makeSampleBuffer(from: image) {
                      if displayLayer.status == .failed {
                          displayLayer.flush()
                      }
                      displayLayer.enqueue(sampleBuffer)
                  }
              }

              private func makeSampleBuffer(from image: UIImage) -> CMSampleBuffer? {
                  guard let cgImage = image.cgImage else { return nil }
                  let width = cgImage.width
                  let height = cgImage.height

                  var pixelBuffer: CVPixelBuffer?
                  let attrs: [CFString: Any] = [
                      kCVPixelBufferCGImageCompatibilityKey: true,
                      kCVPixelBufferCGBitmapContextCompatibilityKey: true
                  ]
                  let status = CVPixelBufferCreate(
                      kCFAllocatorDefault,
                      width,
                      height,
                      kCVPixelFormatType_32ARGB,
                      attrs as CFDictionary,
                      &pixelBuffer
                  )
                  guard status == kCVReturnSuccess, let buffer = pixelBuffer else { return nil }

                  CVPixelBufferLockBaseAddress(buffer, [])
                  let data = CVPixelBufferGetBaseAddress(buffer)
                  let colorSpace = CGColorSpaceCreateDeviceRGB()
                  if let context = CGContext(
                      data: data,
                      width: width,
                      height: height,
                      bitsPerComponent: 8,
                      bytesPerRow: CVPixelBufferGetBytesPerRow(buffer),
                      space: colorSpace,
                      bitmapInfo: CGImageAlphaInfo.noneSkipFirst.rawValue
                  ) {
                      context.draw(cgImage, in: CGRect(x: 0, y: 0, width: width, height: height))
                  }
                  CVPixelBufferUnlockBaseAddress(buffer, [])

                  var formatDescription: CMVideoFormatDescription?
                  CMVideoFormatDescriptionCreateForImageBuffer(
                      allocator: kCFAllocatorDefault,
                      imageBuffer: buffer,
                      formatDescriptionOut: &formatDescription
                  )
                  guard let formatDesc = formatDescription else { return nil }

                  let now = CMTime(seconds: CACurrentMediaTime(), preferredTimescale: 600)
                  var timing = CMSampleTimingInfo(
                      duration: CMTime(value: 1, timescale: 30),
                      presentationTimeStamp: now,
                      decodeTimeStamp: .invalid
                  )

                  var sampleBuffer: CMSampleBuffer?
                  CMSampleBufferCreateReadyWithImageBuffer(
                      allocator: kCFAllocatorDefault,
                      imageBuffer: buffer,
                      formatDescription: formatDesc,
                      sampleTiming: &timing,
                      sampleBufferOut: &sampleBuffer
                  )
                  return sampleBuffer
              }

              func pictureInPictureControllerDidStartPictureInPicture(_ pictureInPictureController: AVPictureInPictureController) {
                  isPiPActive = true
              }

              func pictureInPictureControllerDidStopPictureInPicture(_ pictureInPictureController: AVPictureInPictureController) {
                  isPiPActive = false
              }

              func pictureInPictureController(
                  _ pictureInPictureController: AVPictureInPictureController,
                  restoreUserInterfaceForPictureInPictureStopWithCompletionHandler completionHandler: @escaping (Bool) -> Void
              ) {
                  completionHandler(true)
              }
          }

          extension PiPIslandManager: AVPictureInPictureSampleBufferPlaybackDelegate {
              func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, setPlaying playing: Bool) {
                  DispatchQueue.main.async { [weak self] in
                      self?.viewModel?.togglePlayPause()
                      self?.pushCurrentFrame()
                  }
              }

              func pictureInPictureControllerTimeRangeForPlayback(_ pictureInPictureController: AVPictureInPictureController) -> CMTimeRange {
                  return CMTimeRange(start: .zero, duration: CMTime(value: 3600 * 24, timescale: 1))
              }

              func pictureInPictureControllerIsPlaybackPaused(_ pictureInPictureController: AVPictureInPictureController) -> Bool {
                  return false
              }

              func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, didTransitionToRenderSize newRenderSize: CMVideoDimensions) {}

              func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, skipByInterval skipInterval: CMTime, completion completionHandler: @escaping () -> Void) {
                  DispatchQueue.main.async { [weak self] in
                      if skipInterval.seconds > 0 {
                          self?.viewModel?.nextTrack()
                      } else {
                          self?.viewModel?.previousTrack()
                      }
                      self?.pushCurrentFrame()
                      completionHandler()
                  }
              }
          }

          /// Hosts the visible SampleBufferDisplayView on screen so iOS automatically transitions it into a
          /// floating Picture-in-Picture Dynamic Island pill the moment the user swipes Home.
          struct PiPLayerHostView: UIViewRepresentable {
              let sampleView: SampleBufferDisplayView

              func makeUIView(context: Context) -> UIView {
                  let container = UIView(frame: CGRect(x: 0, y: 0, width: 320, height: 72))
                  container.backgroundColor = .clear
                  sampleView.frame = container.bounds
                  sampleView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  sampleView.layer.cornerRadius = 26
                  sampleView.layer.masksToBounds = true
                  container.addSubview(sampleView)
                  return container
              }

              func updateUIView(_ uiView: UIView, context: Context) {
                  sampleView.frame = uiView.bounds
              }
          }
